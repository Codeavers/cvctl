x-cvctl:
  health: { service: api, http: /health, timeout: 60s }
  s3:
    media:
      buckets:
        products: { public: true }
        prescriptions: {}

services:
  api:
    image: ghcr.io/example/demo-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_PRODUCTS: ${S3_BUCKET_PRODUCTS}
      S3_BUCKET_PRESCRIPTIONS: ${S3_BUCKET_PRESCRIPTIONS}
      S3_PUBLIC_URL_PRODUCTS: ${S3_PUBLIC_URL_PRODUCTS}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      JWT_SECRET: ${JWT_SECRET}
      APP_NAME: ${APP_NAME}
      PUBLIC_URL: ${PUBLIC_URL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    labels:
      cvctl.role: app
      cvctl.expose: "3000"
    deploy: { resources: { limits: { memory: 256m } } }
  worker:
    image: ghcr.io/example/demo-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    labels:
      cvctl.role: worker
    deploy: { resources: { limits: { memory: 128m } } }
  main-db:
    labels: { cvctl.kind: postgres, cvctl.version: "16", cvctl.env: DATABASE }
  cache:
    labels: { cvctl.kind: redis, cvctl.env: REDIS, cvctl.external: allowed }
  media:
    labels: { cvctl.kind: s3, cvctl.env: S3, cvctl.external: allowed, cvctl.expose: "9000" }
