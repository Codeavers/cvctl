x-cvctl:
  health: { service: api, http: /health, timeout: 60s }
  hooks:
    pre-deploy:
      - { service: api, run: "/app migrate" }
  s3:
    media:
      buckets:
        pub: { public: true }
        priv: {}

services:
  api:
    image: localhost:5000/e2e/api
    labels:
      cvctl.role: app
      cvctl.expose: "8080"
    deploy:
      resources:
        limits:
          memory: 128m
    environment:
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET}
      GREETING: ${GREETING}
      PUBLIC_URL: ${PUBLIC_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PUB: ${S3_BUCKET_PUB}
      S3_BUCKET_PRIV: ${S3_BUCKET_PRIV}
      S3_PUBLIC_URL_PUB: ${S3_PUBLIC_URL_PUB}
  cache:
    labels:
      cvctl.kind: redis
      cvctl.env: REDIS
  db:
    labels:
      cvctl.kind: postgres
      cvctl.env: DATABASE
    deploy:
      resources:
        limits:
          memory: 256m
  media:
    labels:
      cvctl.kind: s3
      cvctl.env: S3
      cvctl.expose: "9000"
    deploy:
      resources:
        limits:
          memory: 256m
