x-cvctl:
  health:
    service: api
    http: /health
    port: 3000
    timeout: 30s
  s3:
    media:
      buckets:
        bad_name: {}

services:
  api:
    image: ghcr.io/x/api:1
    labels:
      cvctl.role: app
      cvctl.expose: "3000"
    deploy:
      resources:
        limits:
          memory: 256M
  media:
    labels:
      cvctl.kind: s3
      cvctl.env: S3
