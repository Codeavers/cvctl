x-cvctl:
  health:
    service: api
    http: /health
    timeout: 30s
  verify:
    service: api
    sql: select 1
  hooks:
    pre_deploy:
      - service: api
        run: migrate
services:
  api:
    image: ghcr.io/x/api:1
    expose: ["3000"]
    labels:
      cvctl.role: app
    environment:
      DATABASE_URL: ${DB_URL}
      JWT: $JWT
    deploy:
      resources:
        limits:
          memory: 256M
  db:
    labels:
      cvctl.kind: postgres
      cvctl.version: "16"
      cvctl.env: DB
  cron:
    image: x/cron:1
    deploy:
      resources:
        limits:
          memory: 64M
