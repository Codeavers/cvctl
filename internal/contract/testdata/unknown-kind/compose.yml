x-cvctl:
  health:
    service: api
    http: /health
    timeout: 30s
  verify:
    service: cache
    sql: select 1
  hooks:
    pre-deploy:
      - service: api
        run: migrate
services:
  api:
    image: ghcr.io/x/api:1
    labels:
      cvctl.role: app
      cvctl.expose: "3000"
    environment:
      DATABASE_URL: ${DB_URL}
      JWT: $JWT
    deploy:
      resources:
        limits:
          memory: 256M
  cache:
    labels:
      cvctl.kind: mongo
      cvctl.env: CACHE
