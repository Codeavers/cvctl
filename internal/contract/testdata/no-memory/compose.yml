x-cvctl:
  health:
    service: api
    http: /health
    timeout: 30s
  verify:
    service: api
    sql: select 1
  hooks:
    pre_deploy:
      - service: api
        run: migrate
services:
  api:
    image: ghcr.io/x/api:1
    labels: [cvctl.role=app]
    environment:
      DATABASE_URL: ${DB_URL}
      JWT: $JWT
  db:
    labels:
      cvctl.kind: postgres
      cvctl.version: "16"
      cvctl.env: DB

