x-cvctl:
  health:
    service: api
    http: /health
    timeout: 30s
  verify:
    service: api
    sql: select 1
  hooks:
    pre-deploy:
      - service: api
        run: migrate
services:
  api:
    image: ghcr.io/x/api:1
    labels:
      cvctl.role: app
      cvctl.expose: "3000"
    environment:
      DATABASE_URL: ${DB_URL}
      JWT: $JWT
    deploy:
      resources:
        limits:
          memory: 256M
    ports: ["8080:3000"]
  db:
    labels:
      cvctl.kind: postgres
      cvctl.version: "16"
      cvctl.env: DB

