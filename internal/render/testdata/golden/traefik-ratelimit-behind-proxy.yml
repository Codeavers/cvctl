http:
  middlewares:
    proj-dev--api--ratelimit:
      rateLimit:
        average: 200
        burst: 400
        sourceCriterion:
          ipStrategy:
            depth: 1
    proj-dev--api--redirect-0:
      redirectRegex:
        permanent: true
        regex: ^https?://[^/]+(.*)$
        replacement: https://api.example.com${1}
  routers:
    proj-dev--api:
      entryPoints:
        - web
      middlewares:
        - cvctl-headers@file
        - proj-dev--api--ratelimit
        - cvctl-inflight@file
      rule: Host(`api.example.com`)
      service: proj-dev--api
    proj-dev--api--alias-0:
      entryPoints:
        - web
      middlewares:
        - cvctl-headers@file
        - proj-dev--api--ratelimit
        - cvctl-inflight@file
      rule: Host(`api2.example.com`)
      service: proj-dev--api
    proj-dev--api--redirect-0:
      entryPoints:
        - web
      middlewares:
        - cvctl-headers@file
        - proj-dev--api--ratelimit
        - cvctl-inflight@file
        - proj-dev--api--redirect-0
      rule: Host(`www.api.example.com`)
      service: noop@internal
  services:
    proj-dev--api:
      loadBalancer:
        servers:
          - url: http://proj-dev--api:3000
