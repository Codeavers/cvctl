http:
  routers:
    proj-dev-api:
      entryPoints:
        - websecure
      middlewares:
        - cvctl-default@file
      rule: Host(`api.example.com`)
      service: proj-dev-api
      tls:
        certResolver: le
  services:
    proj-dev-api:
      loadBalancer:
        servers:
          - url: http://proj-dev-api:3000
