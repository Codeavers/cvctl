networks:
  app: {}
  data:
    internal: true
  edge:
    external: true
    name: cvctl-edge
services:
  api:
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
    env_file:
      - /srv/inst/proj-dev/app.env
    environment:
      S3_BUCKET_PRESCRIPTIONS: ${S3_BUCKET_PRESCRIPTIONS}
      S3_BUCKET_PRODUCTS: ${S3_BUCKET_PRODUCTS}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_URL_PRODUCTS: ${S3_PUBLIC_URL_PRODUCTS}
    image: ghcr.io/org/project-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    labels:
      cvctl.expose: "3000"
      cvctl.role: app
    networks:
      app: {}
      data: {}
      edge:
        aliases:
          - proj-dev-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  media:
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    cap_drop:
      - ALL
    command:
      - server
      - /data
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_ROOT_USER: rootuser
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    labels:
      cvctl.env: S3
      cvctl.expose: "9000"
      cvctl.kind: s3
    networks:
      data: {}
      edge:
        aliases:
          - proj-dev-media
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - media-data:/data
volumes:
  media-data:
    name: proj-dev_media-data
