networks:
  app: {}
  backup:
    external: true
    name: proj-prod_backup
  data:
    internal: true
  edge:
    external: true
    name: proj-prod_edge
services:
  api:
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
    env_file:
      - /srv/deploy/proj-prod/app.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    image: ghcr.io/org/project-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    labels:
      cvctl.expose: "3000"
      cvctl.role: app
    networks:
      app: {}
      data: {}
      edge:
        aliases:
          - proj-prod--api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  cache:
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    cap_drop:
      - ALL
    command:
      - redis-server
      - --requirepass
      - p$$w
      - --appendonly
      - "yes"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - p$$w
        - ping
    image: redis:7-alpine
    labels:
      cvctl.env: REDIS
      cvctl.external: allowed
      cvctl.kind: redis
    networks:
      - data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - cache-data:/data
  main-db:
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    cap_drop:
      - ALL
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60
    deploy:
      resources:
        limits:
          memory: 512m
    env_file:
      - /srv/deploy/proj-prod/backup-main-db.env
    environment:
      PGDATABASE: dbname
      PGHOST: /var/run/postgresql
      PGUSER: u
      POSTGRES_DB: dbname
      POSTGRES_PASSWORD: p$$w
      POSTGRES_USER: u
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U u -d dbname
    image: ghcr.io/codeavers/cvctl-postgres:16
    labels:
      cvctl.env: DATABASE
      cvctl.kind: postgres
      cvctl.version: "16"
    networks:
      - data
      - backup
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - main-db-data:/var/lib/postgresql/data
  media:
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    cap_drop:
      - ALL
    command:
      - server
      - /data
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      MINIO_ROOT_PASSWORD: p$$w
      MINIO_ROOT_USER: u
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    labels:
      cvctl.env: S3
      cvctl.external: allowed
      cvctl.kind: s3
    networks:
      - data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - media-data:/data
volumes:
  cache-data:
    name: proj-prod_cache-data
  main-db-data:
    name: proj-prod_main-db-data
  media-data:
    name: proj-prod_media-data
