x-cvctl:
  health: { service: api, http: /health, timeout: 30s }
  s3:
    media:
      buckets:
        products: { public: true }
        prescriptions: {}

services:
  api:
    image: ghcr.io/org/project-api
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_PRODUCTS: ${S3_BUCKET_PRODUCTS}
      S3_PUBLIC_URL_PRODUCTS: ${S3_PUBLIC_URL_PRODUCTS}
      S3_BUCKET_PRESCRIPTIONS: ${S3_BUCKET_PRESCRIPTIONS}
    labels:
      cvctl.role: app
      cvctl.expose: "3000"
    deploy: { resources: { limits: { memory: 512m } } }
  media:
    labels:
      cvctl.kind: s3
      cvctl.env: S3
      cvctl.expose: "9000"
