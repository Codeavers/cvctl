api:
  dashboard: false
accessLog: {}
log:
  level: INFO
ping:
  entryPoint: ping
entryPoints:
  ping:
    address: :8082
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443
    http3: {}
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
certificatesResolvers:
  le:
    acme:
      email: acme@example.com
      storage: /acme/acme.json
      dnsChallenge:
        provider: route53
