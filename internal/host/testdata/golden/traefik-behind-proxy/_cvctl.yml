http:
  middlewares:
    cvctl-default:
      chain:
        middlewares:
          - cvctl-headers
          - cvctl-ratelimit
          - cvctl-inflight
    cvctl-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
    cvctl-inflight:
      inFlightReq:
        amount: 100
    cvctl-ratelimit:
      rateLimit:
        average: 100
        burst: 300
        sourceCriterion:
          ipStrategy:
            depth: 1
