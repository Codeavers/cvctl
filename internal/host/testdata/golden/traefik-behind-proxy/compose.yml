services:
  traefik:
    container_name: cvctl-traefik
    image: traefik:v3.7.15
    restart: unless-stopped
    ports:
      - 127.0.0.1:8081:80
    volumes:
      - /etc/cvctl/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /etc/traefik/dynamic:/etc/traefik/dynamic:ro
      - cvctl-traefik-acme:/acme
    networks:
      - cvctl-edge-proxy
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
networks:
  cvctl-edge-proxy:
    external: true
volumes:
  cvctl-traefik-acme: {}
