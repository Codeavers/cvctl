api:
  dashboard: false
accessLog: {}
log:
  level: INFO
ping:
  entryPoint: ping
entryPoints:
  ping:
    address: :8082
  web:
    address: :80
    forwardedHeaders:
      trustedIPs:
        - 127.0.0.1/32
        - 10.203.0.1/32
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
