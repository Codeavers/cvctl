services:
  traefik:
    container_name: cvctl-traefik
    image: traefik:v3.7.15
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - /etc/cvctl/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /etc/traefik/dynamic:/etc/traefik/dynamic:ro
      - cvctl-traefik-acme:/acme
    networks:
      cvctl-edge-proxy:
        gw_priority: 1000
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
networks:
  cvctl-edge-proxy:
    external: true
volumes:
  cvctl-traefik-acme: {}
