http:
  middlewares:
    cvctl-default:
      chain:
        middlewares:
          - cvctl-headers
          - cvctl-ratelimit
          - cvctl-inflight
    cvctl-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
    cvctl-inflight:
      inFlightReq:
        amount: 100
    cvctl-ratelimit:
      rateLimit:
        average: 50
        burst: 100
