http:
  middlewares:
    cvctl-default:
      chain:
        middlewares:
          - headers
          - rateLimit
          - inFlightReq
    headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
    inFlightReq:
      inFlightReq:
        amount: 100
    rateLimit:
      rateLimit:
        average: 50
        burst: 100
