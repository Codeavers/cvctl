name: image-postgres

on:
  push:
    branches: [main]
    paths:
      - images/postgres/**
      - .github/workflows/image-postgres.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: [15, 16, 17]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: images/postgres
          platforms: linux/amd64,linux/arm64
          build-args: PG_MAJOR=${{ matrix.pg }}
          push: true
          tags: |
            ghcr.io/codeavers/cvctl-postgres:${{ matrix.pg }}
            ghcr.io/codeavers/cvctl-postgres:${{ matrix.pg }}-${{ steps.sha.outputs.short }}
