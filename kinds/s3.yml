name: s3
image: pgsty/silo:{version}
versions: ["RELEASE.2026-09-16T00-00-00Z"]
default_version: "RELEASE.2026-09-16T00-00-00Z"
port: 9000
volume_path: /data
command: ["server", "/data"]
container_env:
  MINIO_ROOT_USER: "{user}"
  MINIO_ROOT_PASSWORD: "{password}"
env:
  ENDPOINT: "http://{host}:{port}"
  BUCKET: "{db}"
  ACCESS_KEY: "{app_user}"
  SECRET_KEY: "{app_password}"
  REGION: us-east-1
backup: volume
external: [endpoint, bucket, access_key, secret_key, region]
health: ["CMD", "mc", "ready", "local"]
buckets: true
cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
