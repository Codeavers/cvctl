name: mongodb
image: mongo:{version}
# 8 refuses to start on Linux 6.19 and newer: https://jira.mongodb.org/browse/SERVER-121912
versions: ["7", "8"]
default_version: "7"
port: 27017
volume_path: /data/db
container_env:
  MONGO_INITDB_ROOT_USERNAME: "{user}"
  MONGO_INITDB_ROOT_PASSWORD: "{password}"
  MONGO_INITDB_DATABASE: "{db}"
env:
  URL: "mongodb://{user}:{password}@{host}:{port}/{db}?authSource=admin"
backup: dump
external: [url]
# mongosh takes its password from the script, read from the environment. HOME
# leaves its logs out of the data directory, the image's default HOME.
health: ["CMD-SHELL", "HOME=/tmp mongosh --nodb --quiet --norc --eval 'const e = process.env; const d = connect(\"mongodb://\" + encodeURIComponent(e.MONGO_INITDB_ROOT_USERNAME) + \":\" + encodeURIComponent(e.MONGO_INITDB_ROOT_PASSWORD) + \"@127.0.0.1:27017/admin?serverSelectionTimeoutMS=3000\"); if (d.adminCommand({getCmdLineOpts: 1}).parsed.security?.authorization !== \"enabled\") quit(1)'"]
# The tools read a password only from argv or a --config file. A JSON string is
# a YAML one that keeps every character of the password. mongosh stays off
# stdin, which carries the archive to mongorestore.
dump_command:
  - |
    umask 077; f=$(mktemp) || exit 1; trap 'rm -f "$f"' EXIT
    HOME=/tmp mongosh --nodb --quiet --norc --eval 'print("password: " + JSON.stringify(process.env.MONGO_INITDB_ROOT_PASSWORD))' </dev/null >"$f" || exit 1
    mongodump --config "$f" --username "$MONGO_INITDB_ROOT_USERNAME" --authenticationDatabase admin --archive
# admin holds the users: the engine keeps those it started with.
restore_command:
  - |
    umask 077; f=$(mktemp) || exit 1; trap 'rm -f "$f"' EXIT
    HOME=/tmp mongosh --nodb --quiet --norc --eval 'print("password: " + JSON.stringify(process.env.MONGO_INITDB_ROOT_PASSWORD))' </dev/null >"$f" || exit 1
    mongorestore --config "$f" --username "$MONGO_INITDB_ROOT_USERNAME" --authenticationDatabase admin --archive --drop --nsExclude 'admin.*'
# The dump holds every database: admin, config and local are the engine's own.
restore_check: "HOME=/tmp mongosh --nodb --quiet --norc --eval 'const e = process.env; const d = connect(\"mongodb://\" + encodeURIComponent(e.MONGO_INITDB_ROOT_USERNAME) + \":\" + encodeURIComponent(e.MONGO_INITDB_ROOT_PASSWORD) + \"@127.0.0.1:27017/admin\"); print(d.adminCommand({listDatabases: 1, nameOnly: true}).databases.filter(x => ![\"admin\", \"config\", \"local\"].includes(x.name)).reduce((n, x) => n + d.getSiblingDB(x.name).getCollectionNames().length, 0))'"
cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
