name: mariadb
image: mariadb:{version}
versions: ["10.11", "11.4"]
default_version: "11.4"
port: 3306
volume_path: /var/lib/mysql
container_env:
  MARIADB_ROOT_PASSWORD: "{password}"
  MARIADB_USER: "{user}"
  MARIADB_PASSWORD: "{password}"
  MARIADB_DATABASE: "{db}"
env:
  URL: "mysql://{user}:{password}@{host}:{port}/{db}"
backup: dump
external: [url]
health: ["CMD-SHELL", "MYSQL_PWD=\"$MARIADB_ROOT_PASSWORD\" mariadb --protocol=tcp -h 127.0.0.1 -uroot -e 'select 1'"]
dump_command: ["MYSQL_PWD=\"$MARIADB_ROOT_PASSWORD\"", "mariadb-dump", "-uroot", "--single-transaction", "--routines", "--events", "--databases", "\"$MARIADB_DATABASE\""]
restore_command: ["MYSQL_PWD=\"$MARIADB_ROOT_PASSWORD\"", "mariadb", "-uroot"]
restore_check: "MYSQL_PWD=\"$MARIADB_ROOT_PASSWORD\" mariadb -uroot -N -B -D \"$MARIADB_DATABASE\" -e 'select count(*) from information_schema.tables where table_schema = database()'"
cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
